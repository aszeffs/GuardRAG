# Trivy exceptions.
#
# Findings recorded here are excluded from the gate in
# `.github/workflows/container.yml`. Nothing else is: the threshold stays at
# HIGH, `ignore-unfixed` stays off, and the gate stays on. This file is the only
# way around a finding, and it is deliberately the expensive way.
#
# Every entry needs three things, and `scripts/check_trivy_exceptions.py` fails
# the build if any is missing:
#
#   id          the finding, exactly as Trivy reports it
#   statement   why it cannot be fixed here, in a sentence someone else can read
#   expired_at  YYYY-MM-DD, at most 180 days out, when the decision is revisited
#
# Entries go under the section matching the scan that raised them:
# `vulnerabilities:` for a CVE in the image or a dependency, `misconfigurations:`
# for a Dockerfile check such as DS-0002.
#
# Trivy stops honouring an entry the day it expires, so a forgotten exception
# reopens the gate rather than quietly holding it shut. See
# `docs/trivy-exceptions.md`.

vulnerabilities:
  # Recorded 2026-10-04, from the first scan of this image (PR #17). Every one is
  # in a Debian package of the python:3.12-slim base that Debian has not fixed
  # yet. The fixable findings from that scan (pip, libpcre2) were fixed in the
  # Dockerfile rather than recorded here. Expiry is short on purpose: if these
  # are still unfixed by then, the assumption deserves a fresh look.
  - id: CVE-2026-76642
    statement: >-
      util-linux 2.41.5-0+deb13u1 (bsdutils, libblkid1, libmount1, libuuid1,
      login, mount and related packages) in the python:3.12-slim base, which
      is Essential in Debian. Debian 13 has published no fixed build, so
      neither the base image nor the apt-get upgrade in the Dockerfile can
      take one. Drop this entry once a fixed build is published.
    expired_at: 2026-11-30
