name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the summary comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies introduced by this PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Strong copyleft would bind how GuardRAG itself may be distributed.
          # Flag it for a decision rather than absorbing it silently through a
          # transitive dependency.
          deny-licenses: AGPL-3.0, GPL-3.0
          # Recorded 2026-10-09 (#13); re-check by 2026-11-30, with the Trivy
          # exceptions (#21). Both sit in promptfoo 0.124.1's tree, which only
          # runs the red-team suite in CI against 127.0.0.1 and is not in the
          # image. Neither code path runs there.
          # - GHSA-c475-qrg2-pj4r: basic-ftp directory-listing ReDoS, via
          #   proxy-agent > get-uri. promptfoo never fetches over FTP. The fix
          #   (6.x) is a major past what get-uri accepts.
          # - GHSA-86w9-cpqp-85rv: node-forge RSA signature check, via jks-js
          #   (Java keystores for TLS config, unused). No patched release.
          allow-ghsas: GHSA-c475-qrg2-pj4r, GHSA-86w9-cpqp-85rv
