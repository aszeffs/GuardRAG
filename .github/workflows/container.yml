name: Container

on:
  # Pull requests are where a bad image gets caught, and they never publish. A
  # push to `main` is a merge that has already passed these checks once, and it
  # is the only trigger that publishes; see the `publish` job.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Never, on any trigger. This job has no registry credentials, and
          # pushing from here would publish before the scan and smoke test had
          # seen the image. The `publish` job pushes these same bytes later.
          push: false
          # Without this the image stays in the builder and there is nothing to
          # export below.
          load: true
          tags: guardrag:${{ github.sha }}
          # Written into the image itself, so the commit is recoverable from a
          # pulled image even after its tags have moved. The source label is
          # also what links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The cache is scoped to the repository by the Actions cache service,
          # so a fork's build cannot poison it.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export the image for the jobs below
        # Handing the scan these exact bytes, rather than having it rebuild from
        # the same Dockerfile, is what makes "the image was scanned" mean the
        # image that was built and later published.
        run: docker save --output image.tar "guardrag:${{ github.sha }}"

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image
          path: image.tar
          # Already-compressed layers; re-compressing them costs minutes and
          # saves almost nothing.
          compression-level: 0
          # A hand-off between jobs of one run, not something to keep.
          retention-days: 1

  smoke:
    name: Container smoke test
    needs: build
    runs-on: ubuntu-latest
    services:
      # A real pgvector Postgres, the same digest as ci.yml, because a missing
      # driver or a schema the image cannot read is exactly what a fake hides.
      db:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: guardrag
          POSTGRES_PASSWORD: guardrag
          POSTGRES_DB: guardrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardrag -d guardrag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://guardrag:guardrag@localhost:5432/guardrag
      IMAGE: guardrag:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the image built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Load the image
        run: docker load --input image.tar

      - name: Check the image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          if [ -z "$user" ] || [ "$user" = root ] || [ "$user" = 0 ]; then
            echo "FAIL: $IMAGE runs as '${user:-root}'" >&2
            exit 1
          fi
          echo "ok: runs as $user"

      - name: Apply schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Boot the image and wait for /health
        # Host networking, so the container reaches the service database on the
        # same `localhost` URL the steps above use.
        run: |
          docker run --detach --name api --network host -e DATABASE_URL "$IMAGE"
          for _ in $(seq 60); do
            if body="$(curl --silent --fail http://localhost:8000/health)"; then
              echo "$body"
              if [ "$(jq -r .status <<< "$body")" = ok ]; then exit 0; fi
              echo "FAIL: /health answered but not ok" >&2
              exit 1
            fi
            sleep 1
          done
          echo "FAIL: /health did not answer within 60s" >&2
          exit 1

      - name: Show the container log
        if: always()
        run: docker logs api || true

  scan:
    name: Trivy image scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Widened only here, and only far enough to write findings to the
      # Security tab, beside the CodeQL results.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the recorded exceptions
        # First, and gating. Trivy honours an exception with no justification
        # and no expiry, which is the gate switched off for one finding forever.
        # `pipefail`, or the step would report `tee`'s exit code and pass
        # however loudly the check failed.
        run: |
          set -o pipefail
          pip install pyyaml
          python scripts/check_trivy_exceptions.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the image built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      # Each scan runs twice, and the order is load-bearing. The reporting run
      # never fails, so its SARIF is uploaded before the gating run can end the
      # job; findings reach the Security tab even on builds that go red. The
      # gating run then prints a table, so a red job shows the CVE in its log.
      #
      # There is no separate lockfile scan: the project has no lockfile, and the
      # image scan reads the Python packages actually installed in it. Dev-only
      # tools (pytest, ruff) never reach the image.

      - name: Scan the image and report every finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # `input` rather than `image-ref`, so the scan reads the tar the build
          # job produced instead of resolving a tag.
          input: image.tar
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          # No severity filter, so every severity reaches the Security tab.
          # Severity decides what blocks a merge, below, not what is visible.
          trivyignores: .trivyignore.yaml

      - name: Upload the image findings
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Fail on high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: image.tar
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # `ignore-unfixed` is deliberately off. It would drop exactly the
          # findings the exception process exists for, silently, with no
          # justification and no expiry.
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

      - name: Scan the Dockerfile and report every misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-dockerfile.sarif
          exit-code: "0"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

      - name: Upload the Dockerfile findings
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-dockerfile.sarif
          category: trivy-dockerfile

      - name: Fail on high or critical Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

      - name: Generate the SBOM
        # Here, from the tar the scan read, rather than in the attest job: that
        # job holds a token that can sign as this workflow, and a scanner has no
        # business running beside it. Generated on pull requests too, where it
        # leaves the SBOM of a proposed image downloadable from the run.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: image.tar
          # SPDX 2.3, which the attestation records as its predicate type.
          format: spdx-json
          output: sbom.spdx.json
          skip-setup-trivy: true

      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GHCR
    # An image reaches the registry only once the scan has found nothing
    # unaccounted for and the smoke test has watched it boot.
    needs: [build, smoke, scan]
    # A merge to `main` alone. A pull request, including one from a fork,
    # builds and checks the image but never reaches this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Widened only here, so no job that runs the image holds a token that
      # can write to the registry.
      contents: read
      packages: write
    # One publish at a time, so the head check and the push of `latest` cannot
    # interleave with another run's.
    concurrency:
      group: container-publish-main
      cancel-in-progress: false
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job token, which here can write packages, sits in
          # `.git/config` for every later step.
          persist-credentials: false

      - name: Download the image built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Load the image
        # The exact bytes the scan and the smoke test passed, not a rebuild.
        run: docker load --input image.tar

      - name: Log in to GHCR
        # The Docker CLI rather than a login action: one fewer third-party
        # action holding the token. It arrives on stdin, never in argv.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push the commit tag, then latest
        id: push
        # The head is read from the remote at push time rather than taken from
        # the event, so an older run finishing last cannot move `latest` back.
        shell: bash
        run: |
          set -euo pipefail
          # GHCR names must be lowercase; the repository is not.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "guardrag:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$GITHUB_SHA" | grep "^$image@")"
          digest="${ref#*@}"
          head="$(git ls-remote --exit-code origin refs/heads/main | cut -f 1)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            docker tag "guardrag:$GITHUB_SHA" "$image:latest"
            docker push "$image:latest"
          else
            echo "main has moved on to $head; leaving latest where it is."
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  attest:
    name: Attest provenance and SBOM
    needs: [publish, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Widened only here. `id-token` lets this job request an OIDC token naming
      # this workflow, commit and ref; Sigstore issues a short-lived signing
      # certificate for exactly that identity, so there is no private key to
      # store, leak or rotate. `attestations` records the signed statements
      # against the repository, and `packages` pushes a copy beside the image.
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      # No checkout. Nothing from the repository runs in the job holding the
      # signing identity.

      - name: Download the SBOM generated by the scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # Both attestations name the image by the digest the push reported, never
      # by a tag, so they bind to those bytes whatever the tags do later.

      - name: Attest build provenance
        # With no SBOM or predicate input, `actions/attest` generates SLSA build
        # provenance.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # Storage records exist only for organisation-owned repositories.
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  verify-attestations:
    name: Verify the attestations as a consumer would
    needs: [publish, attest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Read-only, on a fresh runner: the position of anyone checking an image
    # they did not build. `packages: read` lets it resolve the image whether or
    # not the package has been made public yet.
    permissions:
      contents: read
      attestations: read
      packages: read
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Log in to GHCR read-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Verify provenance and SBOM, from the API and from the registry
        # Each constraint is a flag `gh` enforces, so a statement signed by
        # another workflow, built from another commit or ref, or built on a
        # self-hosted runner fails here rather than passing on a signature that
        # is merely valid.
        run: |
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            for source in api oci; do
              extra=()
              if [ "$source" = oci ]; then extra=(--bundle-from-oci); fi
              echo "::group::$predicate from $source"
              gh attestation verify "oci://$IMAGE@$DIGEST" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container.yml" \
                --source-ref refs/heads/main \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners \
                --predicate-type "$predicate" \
                "${extra[@]}"
              echo "::endgroup::"
            done
          done

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
