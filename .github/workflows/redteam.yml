name: Red-team

# The promptfoo suite of 30 Red-Team Attacks (#13; README "Red-team suite"), run on every PR
# against a live `/ask` with the production pipeline. Fails if fewer than the gate are blocked.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its unfinished run, so stale runs don't use up the Groq quota.
concurrency:
  group: redteam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redteam:
    name: redteam
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        # Same digest as ci.yml; bump them together.
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: guardrag
          POSTGRES_PASSWORD: guardrag
          POSTGRES_DB: guardrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardrag -d guardrag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://guardrag:guardrag@localhost:5432/guardrag
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/models
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      # Empty on PRs from forks and from Dependabot, which get no repository secrets.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # The suite sends every attack from one IP; the per-client limit is not what it tests.
      RATE_LIMIT_REQUESTS: 1000
      PROMPTFOO_DISABLE_TELEMETRY: 1
      PROMPTFOO_DISABLE_UPDATE: 1
      # Attacks that got through are counted by the tally step, which applies the gate.
      PROMPTFOO_FAILED_TEST_EXIT_CODE: 0
    steps:
      # A PR without the key passes with a notice instead of failing. Anything else needs the key.
      - name: Check for the Groq key
        id: key
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::notice::No GROQ_API_KEY (a fork or Dependabot PR), so the red-team suite is skipped."
          else
            echo "::error::GROQ_API_KEY is not set."
            exit 1
          fi
      - if: steps.key.outputs.present
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.key.outputs.present
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.key.outputs.present
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: evals/redteam/package-lock.json
      - if: steps.key.outputs.present
        run: pip install -e .
      # promptfoo's install scripts only build optional native modules that `--no-write` doesn't use.
      - if: steps.key.outputs.present
        working-directory: evals/redteam
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the pass conditions
        if: steps.key.outputs.present
        working-directory: evals/redteam
        run: node --test checks.test.js
      - name: Apply schema
        if: steps.key.outputs.present
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Cache the raw Corpus downloads
        if: steps.key.outputs.present
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: corpus-raw-${{ hashFiles('guardrag/ingest/sources.yaml') }}
          restore-keys: corpus-raw-
      - name: Cache the embedder
        if: steps.key.outputs.present
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: embedder-paraphrase-multilingual-MiniLM-L12-v2
      - name: Seed the Corpus
        if: steps.key.outputs.present
        run: python -m guardrag.ingest
      - name: Start the API
        if: steps.key.outputs.present
        run: |
          nohup uvicorn guardrag.api:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf 127.0.0.1:8000/health && exit 0
            sleep 2
          done
          echo "::error::The API did not become healthy."
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Run the attacks
        if: steps.key.outputs.present
        working-directory: evals/redteam
        run: npx promptfoo eval --no-progress-bar --no-write -o "$RUNNER_TEMP/promptfoo.json"
      - name: Tally and gate
        if: steps.key.outputs.present
        run: >-
          python -m guardrag.evals.redteam "$RUNNER_TEMP/promptfoo.json" --min-blocked 28
          --out "$RUNNER_TEMP/redteam.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.key.outputs.present
        with:
          name: redteam
          path: |
            ${{ runner.temp }}/redteam.json
            ${{ runner.temp }}/promptfoo.json
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore
