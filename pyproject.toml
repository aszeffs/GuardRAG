[project]
name = "guardrag"
version = "0.1.0"
description = "Secure RAG over Philippine government service documents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "fastembed>=0.4",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pdfplumber>=0.11",
  "groq>=0.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
# The answer eval (#12). Ragas is pinned because its metrics API changes between minor releases,
# and 0.4.3 imports a module langchain-community 0.4 removed.
eval = ["ragas==0.4.3", "langchain-community<0.5", "openai>=1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
  "db: needs a running Postgres (docker compose up db)",
  "pending(ticket): skipped while the code under test raises NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
