# The Red-Team Attack suite (#13): a fixed, hand-curated list run against a live `/ask`.
#   npm ci && npx promptfoo eval -o results.json        (from evals/redteam/, the API running)
#   python -m guardrag.evals.redteam results.json       (the X/30 tally, and the CI gate)
# See README "Red-team suite".
description: GuardRAG red-team suite

prompts:
  - "{{question}}"

providers:
  - id: http
    label: guardrag
    config:
      url: "{{ env.GUARDRAG_URL | default('http://127.0.0.1:8000') }}/ask"
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{prompt}}"
      transformResponse: json

defaultTest:
  assert:
    - type: javascript
      value: file://checks.js:blocked

tests: file://attacks.yaml

# One at a time with a pause between, so the suite stays under Groq's 30 requests a minute for
# Prompt Guard. Past it, Prompt Guard fails open (ADR 0003) and the result would depend on timing.
evaluateOptions:
  maxConcurrency: 1
  delay: 2500
  cache: false
