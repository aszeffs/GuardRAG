# Golden Set (CONTEXT.md) for the retrieval eval (#9) and, later, the answer evals.
#
# LLM-drafted from the source documents, reviewed by the author.
#
# Each question is either `answerable`, with `expected` Targets, or `out_of_corpus`, with the
# `agency` its Refusal should point to. A Target names a document by its title in
# guardrag/ingest/sources.yaml, plus a section heading as ingest stores it. With no section, any
# Passage of the document meets it. `any_of` lists alternative places the same fact is stated.
# All Targets are needed for a full answer, so a question spanning two Agencies has two.
#
# language: en | fil | taglish. Tags: trick (written to mislead a retriever or an answer),
# exact-term (hinges on a form number, peso amount or acronym), cross-agency, statute.

questions:
  # SSS
  - id: sss-salary-loan-eligibility
    question: How many posted contributions do I need to qualify for an SSS salary loan?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Salary Loan"
        section: Qualifying Conditions

  - id: sss-salary-loan-interest
    question: What is the interest rate on an SSS salary loan?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Salary Loan"
        section: Loan Details

  - id: sss-calamity-loan-amount
    question: How much can I borrow from SSS after a typhoon, and what interest is charged?
    language: en
    kind: answerable
    tags: [trick]
    note: Says "after a typhoon" rather than "calamity loan".
    expected:
      - document: "SSS: Calamity Loan"
        section: Calamity Loan Amount

  - id: sss-calamity-vs-salary-interest
    question: Is the interest on an SSS calamity loan lower than on a salary loan?
    language: en
    kind: answerable
    tags: [trick]
    note: Needs both loans' rates; a retriever tends to return only one of them.
    expected:
      - document: "SSS: Calamity Loan"
        section: Calamity Loan Amount
      - document: "SSS: Salary Loan"
        section: Loan Details

  - id: sss-maternity-eligibility
    question: Ilang buwan ng hulog sa SSS ang kailangan para makakuha ng maternity benefit?
    language: fil
    kind: answerable
    expected:
      - document: "SSS: Maternity Benefit"
        section: Qualifying Conditions

  - id: sss-maternity-allocation
    question: Pwede bang i-share ng misis ko sa akin yung maternity leave credits niya? Ilang days?
    language: taglish
    kind: answerable
    expected:
      - document: "SSS: Maternity Benefit"
        section: Allocation of Maternity Leave Credits

  - id: sss-sickness-notification
    question: >-
      I'm sick and resting at home. How many days do I have to notify my employer so I can claim
      the SSS sickness benefit?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Sickness Benefit"
        section: Prescriptive Period

  - id: sss-unemployment-eligibility
    question: I was retrenched. Can I claim the SSS unemployment benefit, and what do I need?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Unemployment Benefit"
        section: Eligibility Requirements

  - id: sss-unemployment-law
    question: >-
      What does the Social Security Act say about how much the unemployment insurance benefit is
      and how often it can be claimed?
    language: en
    kind: answerable
    tags: [statute]
    expected:
      - document: "Republic Act No. 11199 (Social Security Act of 2018)"
        section: Section 14-B

  - id: sss-funeral-without-receipt
    question: >-
      My husband died and I paid for the funeral, but I lost the official receipt. What can I
      submit instead to claim the SSS funeral benefit?
    language: en
    kind: answerable
    expected:
      - any_of:
          - document: "SSS: Funeral Benefit"
            section: If filed by the surviving legal spouse
          - document: "SSS: Funeral Benefit"
            section: "In lieu of Official Receipt, submit (original copy):"
          - document: "SSS: Funeral Benefit"
            section: B. Proof of defrayal of funeral expense

  - id: sss-retirement-age
    question: At what age can I retire under SSS, and how many contributions do I need?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Retirement Benefit"
        section: Qualifying Conditions

  - id: sss-retirement-taglish
    question: Pwede na ba ako mag-retire sa SSS at 60 kung may 120 months contributions na ako?
    language: taglish
    kind: answerable
    expected:
      - document: "SSS: Retirement Benefit"
        section: Qualifying Conditions

  - id: sss-pension-loan-amount
    question: How much can an SSS retiree pensioner borrow through the pension loan?
    language: en
    kind: answerable
    expected:
      - any_of:
          - document: "SSS: New Pension Loan Retiree"
            section: Loan Details
          - document: "SSS: Pension Loan First Time Applicants"
            section: Loan Details

  - id: sss-death-pension
    question: How is the monthly death pension computed for the beneficiaries of an SSS member?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Death Benefit"
        section: Benefit Details

  - id: sss-disability-documents
    question: What documents do I need to file an SSS disability claim?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Disability Benefit"
        section: How to Apply

  - id: sss-change-msc
    question: Can a self-employed member change their monthly salary credit?
    language: en
    kind: answerable
    tags: [exact-term]
    expected:
      - document: "SSS: Pay Contribution"
        section: Changing your MSC

  - id: sss-conso-penalties
    question: What happens to my unpaid loan penalties if I join the SSS Conso Loan program?
    language: en
    kind: answerable
    expected:
      - any_of:
          - document: "SSS: Consolidated Loan Program"
            section: Loan Consolidation Process
          - document: "SSS: Consolidated Loan Program"
            section: Payment Options and Penalty Condonation

  - id: sss-emergency-loan-amount
    question: How is the amount of the SSS emergency loan determined?
    language: en
    kind: answerable
    expected:
      - document: "SSS: Emergency Loan Program"
        section: Loan Details

